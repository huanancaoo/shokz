name: shokz-cms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shokz_cms
      POSTGRES_USER: shokz_cms
      POSTGRES_PASSWORD: shokz_cms_local
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shokz_cms -d shokz_cms"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  postgres:
