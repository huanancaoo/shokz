name: shokz-poc

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: shokz
      POSTGRES_DB: shokz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:15482:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    cpus: 0.25
    mem_limit: 512m
    memswap_limit: 512m
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shokz", "-d", "shokz"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --requirepass
      - ${REDIS_PASSWORD:?}
    ports:
      - "127.0.0.1:16382:6379"
    volumes:
      - redis:/data
    cpus: 0.10
    mem_limit: 128m
    memswap_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  redis:
